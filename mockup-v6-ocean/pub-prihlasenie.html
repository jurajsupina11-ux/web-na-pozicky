<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prihlásenie – Pôžičky pre Dlžníkov</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg?v=1792419099">
<link rel="stylesheet" href="assets/style.css?v=1792419099">
</head>
<body class="role-neutral">
<div class="bg-dots"></div>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="pub-landing.html">
      <img src="assets/logo-full.svg?v=1792419099" alt="Insight Partners" class="logo-full-img">
    </a>
  </div>
</header>

<main>

<section class="section auth-page">
  <div class="wrap" style="max-width:420px;">
    <form class="card form-card" method="post" autocomplete="on">
      
      <h2>Prihlásenie</h2>
      <p class="form-note">Administrátorské prihlásenie. Investori a žiadatelia o pôžičku majú vlastné prihlasovacie stránky.</p>
      
        <label>Používateľské meno<input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
          
        </label>
      
        <label>Heslo<input type="password" name="password" autocomplete="current-password" required id="id_password">
          
        </label>
      
      <button type="submit" class="btn btn-primary btn-block">Prihlásiť sa</button>
      <p class="form-note"><a href="pub-prihlasenie-investor.html">Prihlásenie investora</a> · <a href="pub-prihlasenie-dlznik.html">Prihlásenie žiadateľa</a></p>
    </form>
  </div>
</section>

</main>
<script src="assets/script.js?v=1792419099"></script>
<script>document.addEventListener("submit",function(e){e.preventDefault();});document.addEventListener("click",function(e){var a=e.target.closest("a");if(a&&a.getAttribute("href")==="#"){e.preventDefault();}});</script></body>
</html>
