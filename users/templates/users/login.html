{% load static %}<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prihlásenie – Pôžičky Predlžníkov</title>
<link rel="stylesheet" href="{% static 'theme/style.css' %}">
</head>
<body class="role-neutral">
<div class="bg-dots"></div>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{% url 'core:landing' %}">
      <span class="logo-mark">PP</span><span class="logo-text">Pôžičky<br>Predlžníkov</span>
    </a>
  </div>
</header>

<main>

<section class="section auth-page">
  <div class="wrap" style="max-width:420px;">
    <form class="card form-card" method="post" autocomplete="on">
      {% csrf_token %}
      <h2>Prihlásenie</h2>
      <p class="form-note">Administrátorské prihlásenie. Investori a žiadatelia o pôžičku majú vlastné prihlasovacie stránky.</p>
      {% for field in form %}
        <label>{{ field.label }}{{ field }}
          {% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
        </label>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-block">Prihlásiť sa</button>
      <p class="form-note"><a href="{% url 'users:login_investor' %}">Prihlásenie investora</a> · <a href="{% url 'users:login_borrower' %}">Prihlásenie žiadateľa</a></p>
    </form>
  </div>
</section>

</main>
<script src="{% static 'theme/script.js' %}"></script>
</body>
</html>
