{% load static %}<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overenie identity – Pôžičky Predlžníkov</title>
<link rel="stylesheet" href="{% static 'theme/style.css' %}">
</head>
<body class="role-neutral">
<div class="bg-dots"></div>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{% url 'core:landing' %}">
      <span class="logo-mark">PP</span><span class="logo-text">Pôžičky<br>Predlžníkov</span>
    </a>
  </div>
</header>

<main>

<section class="section auth-page">
  <div class="wrap" style="max-width:620px;">
    <div class="card form-card">
      <h2>Overenie identity</h2>
      <p class="form-note">Pred prvou žiadosťou o pôžičku potrebujeme overiť tvoju identitu. Tieto údaje slúžia len na účely zmluvy o pôžičke a nikdy ich nezverejňujeme.</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-row-2">
          <label>{{ form.first_name.label }}{{ form.first_name }}</label>
          <label>{{ form.last_name.label }}{{ form.last_name }}</label>
        </div>
        <label>{{ form.date_of_birth.label }}{{ form.date_of_birth }}</label>
        <div class="form-row-2">
          <label>{{ form.id_card_number.label }}{{ form.id_card_number }}</label>
          <label>{{ form.birth_number.label }}{{ form.birth_number }}</label>
        </div>
        <label>{{ form.street_address.label }}{{ form.street_address }}</label>
        <div class="form-row-2">
          <label>{{ form.city.label }}{{ form.city }}</label>
          <label>{{ form.postal_code.label }}{{ form.postal_code }}</label>
        </div>
        <label>{{ form.bank_account_iban.label }}{{ form.bank_account_iban }}</label>
        <button type="submit" class="btn btn-primary btn-block">Overiť a pokračovať</button>
      </form>
    </div>
  </div>
</section>

</main>
<script src="{% static 'theme/script.js' %}"></script>
</body>
</html>
