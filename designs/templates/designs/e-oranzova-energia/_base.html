{% load static %}<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pôžičky Predlžníkov{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Rubik',Arial,sans-serif;background:#fffaf5;color:#2a1b10;}
  header{background:#fff;border-bottom:1px solid #ffd9bf;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
  header .logo{font-weight:700;font-size:19px;color:#ff6a2b;}
  .mainnav{display:flex;gap:6px;flex-wrap:wrap;}
  .mainnav a{text-decoration:none;color:#8a6a56;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;}
  .mainnav a.active{background:#ff6a2b;color:#fff;}
  .switchbar{background:#fff3ea;padding:6px 28px;font-size:11px;color:#8a6a56;}
  .switchbar a{color:#ff6a2b;text-decoration:none;}
  .wrap{max-width:1000px;margin:0 auto;padding:30px 24px 70px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
  .card{background:#fff;border:1px solid #ffd9bf;border-radius:18px;padding:22px;}
  .btn{display:inline-block;padding:12px 26px;border-radius:30px;text-decoration:none;font-weight:700;font-size:14px;border:2px solid transparent;cursor:pointer;}
  .btn-primary{background:#ff6a2b;color:#fff;}
  .btn-outline{background:transparent;color:#ff6a2b;border-color:#ff6a2b;margin-left:8px;}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<header>
  <div class="logo">🔥 Pôžičky Predlžníkov</div>
  <div class="mainnav">
    <a href="{% url 'designs:home' design.slug %}" class="{% block nav_home %}{% endblock %}">Úvod</a>
    <a href="{% url 'designs:rooms' design.slug %}" class="{% block nav_rooms %}{% endblock %}">Aukčná miestnosť</a>
    <a href="{% url 'designs:my_loans' design.slug %}" class="{% block nav_myloans %}{% endblock %}">Moje pôžičky</a>
    <a href="{% url 'designs:dashboard' design.slug %}" class="{% block nav_dash %}{% endblock %}">Dashboard</a>
    <a href="{% url 'designs:how_it_works' design.slug %}" class="{% block nav_how %}{% endblock %}">Ako to funguje</a>
  </div>
</header>
<div class="switchbar"><a href="{% url 'designs:index' %}">← všetky mockupy</a> | Dizajn E – Top-nav kartová mriežka</div>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
