{% load static %}<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pôžičky Predlžníkov{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:#0e0b09;color:#fff2e8;}
  .topbar{background:#ff6a2b;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;}
  .topbar .logo{font-family:'Archivo Black',Arial;font-size:18px;color:#0e0b09;}
  .tabs{display:flex;background:#1a1512;padding:0 28px;overflow-x:auto;}
  .tabs a{color:#b89a86;text-decoration:none;padding:14px 18px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs a.active{color:#ff6a2b;border-bottom-color:#ff6a2b;}
  .switchbar{background:#060504;padding:6px 28px;font-size:11px;color:#8a6a56;}
  .switchbar a{color:#ffb037;text-decoration:none;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 20px 70px;}
  .card{background:#1a1512;border:1px solid #352720;border-radius:6px;padding:20px;margin-bottom:14px;}
  .btn{display:inline-block;padding:12px 26px;text-decoration:none;font-weight:700;font-size:14px;border:2px solid transparent;cursor:pointer;}
  .btn-primary{background:#ff6a2b;color:#0e0b09;}
  .btn-outline{background:transparent;color:#fff2e8;border-color:#352720;margin-left:8px;}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<div class="topbar"><div class="logo">⚡ PÔŽIČKY PREDLŽNÍKOV</div><div><a href="#" style="color:#0e0b09;text-decoration:none;font-size:13px;">Prihlásiť sa</a></div></div>
<div class="tabs">
  <a href="{% url 'designs:home' design.slug %}" class="{% block nav_home %}{% endblock %}">ÚVOD</a>
  <a href="{% url 'designs:rooms' design.slug %}" class="{% block nav_rooms %}{% endblock %}">AUKČNÁ MIESTNOSŤ</a>
  <a href="{% url 'designs:my_loans' design.slug %}" class="{% block nav_myloans %}{% endblock %}">MOJE PÔŽIČKY</a>
  <a href="{% url 'designs:dashboard' design.slug %}" class="{% block nav_dash %}{% endblock %}">DASHBOARD</a>
  <a href="{% url 'designs:how_it_works' design.slug %}" class="{% block nav_how %}{% endblock %}">AKO TO FUNGUJE</a>
</div>
<div class="switchbar"><a href="{% url 'designs:index' %}">← všetky mockupy</a> &nbsp;|&nbsp; Dizajn B – Bold timeline štýl</div>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
