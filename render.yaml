databases:
  - name: pozicky-db
    plan: starter
    # Starter plán (platený): trvalé úložisko bez 90-dňovej expirácie, denné
    # automatické zálohy so 7-dňovou retenciou, viac RAM/CPU a súbežných
    # spojení oproti bezplatnému plánu. Zmena plánu sa prejaví po manuálnom
    # potvrdení platby v Render Dashboarde (Blueprint sync ju len pripraví).

services:
  - type: web
    name: pozicky-predlznikov
    env: python
    # Web service môže zostať na free pláne dlhšie (najmä kritický je upgrade
    # databázy), prejdi na starter web plán, keď narastie návštevnosť
    # (free web service sa po neaktivite uspáva, čo spomaľuje prvé požiadavky).
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "pozickypredlznikov.sk,www.pozickypredlznikov.sk"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://pozickypredlznikov.sk,https://www.pozickypredlznikov.sk"
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"

  - type: cron
    name: pozicky-splatnosti-pripomienky
    env: python
    plan: free
    schedule: "0 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_due_date_reminders"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: pozicky-automaticky-odkup
    env: python
    plan: free
    schedule: "30 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py process_buybacks"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: pozicky-zrusenie-nevyfinancovanych
    env: python
    plan: free
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py close_expired_auctions"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: pozicky-zaloha-databazy
    env: python
    plan: free
    # Raz týždenne v nedeľu o 3:00 - nezávislá záloha databázy mimo Render
    # (pg_dump nahraný na S3-kompatibilné úložisko), pozri core/management/
    # commands/backup_database.py pre detaily a potrebné env premenné.
    schedule: "0 3 * * 0"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py backup_database"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false
