databases:
  - name: pozicky-db
    plan: free

services:
  - type: web
    name: pozicky-predlznikov
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "pozickypredlznikov.sk,www.pozickypredlznikov.sk"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://pozickypredlznikov.sk,https://www.pozickypredlznikov.sk"
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
