databases:
  - name: pozicky-db
    plan: free

services:
  - type: web
    name: pozicky-predlznikov
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "pozickypredlznikov.sk,www.pozickypredlznikov.sk"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://pozickypredlznikov.sk,https://www.pozickypredlznikov.sk"
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"

  - type: cron
    name: pozicky-splatnosti-pripomienky
    env: python
    plan: free
    schedule: "0 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_due_date_reminders"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: pozicky-automaticky-odkup
    env: python
    plan: free
    schedule: "30 6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py process_buybacks"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: pozicky-zrusenie-nevyfinancovanych
    env: python
    plan: free
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py close_expired_auctions"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pozicky-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
